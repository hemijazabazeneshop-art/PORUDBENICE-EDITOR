<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>HemijaZaBazeneShop – Otpremnice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Biblioteka za direktno preuzimanje PDF-a -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f4fafc;
  color: #071f38;
}

button,
textarea {
  font: inherit;
}

/* GLAVNI RASPORED */

.app {
  width: 100%;
  max-width: 1220px;
  margin: 0 auto;
  padding: 30px 18px;
}

.layout {
  display: grid;
  grid-template-columns: minmax(420px, 1fr) minmax(500px, 1fr);
  gap: 16px;
  align-items: stretch;
}

.panel {
  min-width: 0;
  background: #ffffff;
  border: 1px solid #d6e7ed;
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 1px 2px rgba(7, 31, 56, 0.02);
}

.left-panel {
  display: flex;
  flex-direction: column;
}

.panel-title {
  margin: 14px 0 16px;
  font-size: 21px;
  line-height: 1.2;
}

/* POLJE ZA HTML */

#htmlInput {
  display: block;
  width: 100%;
  min-height: 540px;
  flex: 1;
  padding: 12px;
  border: 1px solid #cfdfe6;
  border-radius: 10px;
  background: #ffffff;
  color: #071f38;
  font-family: Consolas, Monaco, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.35;
  resize: vertical;
  outline: none;
  tab-size: 2;
}

#htmlInput:focus {
  border-color: #09b5d2;
  box-shadow: 0 0 0 3px rgba(9, 181, 210, 0.1);
}

/* DUGMAD */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 10px 0;
}

.preview-toolbar {
  margin-top: 9px;
  margin-bottom: 10px;
}

button {
  min-height: 30px;
  padding: 7px 12px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
  transition:
    transform 0.12s ease,
    opacity 0.12s ease,
    box-shadow 0.12s ease;
}

button:hover {
  opacity: 0.9;
  box-shadow: 0 3px 9px rgba(7, 31, 56, 0.1);
}

button:active {
  transform: translateY(1px);
}

.primary {
  background: #06b4d2;
  color: #ffffff;
}

.dark {
  background: #071f38;
  color: #ffffff;
}

.red {
  background: #ef4444;
  color: #ffffff;
}

.light {
  background: #e8f7fb;
  color: #07527e;
}

.format-button {
  min-width: 31px;
  padding-left: 8px;
  padding-right: 8px;
}

/* OBAVEŠTENJA */

.notice {
  margin-top: 9px;
  padding: 8px 9px;
  border: 1px solid #f2d792;
  border-radius: 9px;
  background: #fff8e7;
  color: #19344d;
  font-size: 10px;
  line-height: 1.4;
}

/* DOKUMENT SA DESNE STRANE */

.document-page {
  width: 100%;
  min-height: 635px;
  padding: 16px 18px 28px;
  overflow-wrap: anywhere;
  border: 1px solid #d3e3e9;
  border-radius: 11px;
  background: #ffffff;
  color: #0a233c;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
  line-height: 1.45;
  outline: none;
}

.document-page:focus {
  border-color: #09b5d2;
  box-shadow: 0 0 0 3px rgba(9, 181, 210, 0.08);
}

.document-page h1,
.document-page h2,
.document-page h3 {
  color: #071f38;
}

.document-page h1 {
  margin: 0 0 14px;
  font-size: 22px;
  line-height: 1.25;
  font-weight: 900;
}

.document-page h2 {
  margin: 0 0 13px;
  font-size: 19px;
  line-height: 1.3;
}

.document-page h3 {
  margin: 0 0 12px;
  font-size: 16px;
}

.document-page p {
  margin: 4px 0;
}

/* INFORMACIONI BLOKOVI */

.document-page .shop-success-box,
.document-page .order-info-box,
.document-page .customer-info-box {
  margin: 0 0 12px;
  padding: 13px 12px;
  border: 1px solid #d3e5eb;
  border-radius: 10px;
  background: #f7fbfd;
  line-height: 1.48;
}

.document-page .shop-success-box strong,
.document-page .order-info-box strong,
.document-page .customer-info-box strong {
  font-weight: 800;
}

/* TABELA */

.document-page table,
.document-page .shop-success-table {
  width: 100%;
  margin: 13px 0 0;
  border-spacing: 0;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 11px;
}

.document-page table th,
.document-page table td,
.document-page .shop-success-table th,
.document-page .shop-success-table td {
  padding: 7px 9px;
  border: 1px solid #d2e3e9;
  vertical-align: middle;
  overflow-wrap: anywhere;
}

.document-page table th,
.document-page .shop-success-table th {
  background: #edf9fc;
  color: #092844;
  font-weight: 800;
  text-align: left;
}

.document-page table th:nth-child(1),
.document-page table td:nth-child(1) {
  width: 43%;
  text-align: left;
}

.document-page table th:nth-child(2),
.document-page table td:nth-child(2) {
  width: 19%;
  text-align: right;
}

.document-page table th:nth-child(3),
.document-page table td:nth-child(3) {
  width: 38%;
  text-align: right;
}

/* UKUPAN IZNOS */

.document-page .shop-success-total,
.document-page .order-total {
  margin: 12px 0 0;
  color: #071f38;
  font-size: 19px;
  line-height: 1.3;
  font-weight: 900;
  text-align: right;
}

.document-page .shop-success-total small,
.document-page .order-total small {
  font-size: 9px;
  font-weight: 700;
}

/* DODATNE NAPOMENE */

.document-page .document-note {
  margin-top: 13px;
  padding: 10px 12px;
  border: 1px solid #d8e7ec;
  border-radius: 9px;
  background: #f9fcfd;
  font-size: 10px;
  line-height: 1.45;
}

/* PDF REŽIM */

.document-page.pdf-mode {
  width: 190mm;
  min-height: auto;
  padding: 8mm;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

.document-page.pdf-mode table {
  page-break-inside: avoid;
}

.document-page.pdf-mode .shop-success-box,
.document-page.pdf-mode .order-info-box,
.document-page.pdf-mode .customer-info-box,
.document-page.pdf-mode .shop-success-total {
  page-break-inside: avoid;
}

/* MOBILNI PRIKAZ */

@media (max-width: 900px) {
  .app {
    padding: 12px;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  #htmlInput {
    min-height: 420px;
  }

  .document-page {
    min-height: 600px;
  }
}

@media (max-width: 540px) {
  .panel {
    padding: 10px;
    border-radius: 12px;
  }

  .document-page {
    padding: 15px 10px 24px;
  }

  .document-page h1 {
    font-size: 19px;
  }

  .document-page table {
    font-size: 9px;
  }

  .document-page table th,
  .document-page table td {
    padding: 6px 4px;
  }

  button {
    font-size: 10px;
    padding: 7px 9px;
  }
}

/* REZERVNI PRINT REŽIM */

@media print {
  @page {
    size: A4 portrait;
    margin: 10mm;
  }

  body {
    background: #ffffff;
  }

  body * {
    visibility: hidden !important;
  }

  #preview,
  #preview * {
    visibility: visible !important;
  }

  #preview {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
}
</style>
</head>

<body>

<div class="app">
  <div class="layout">

    <!-- LEVA STRANA -->
    <section class="panel left-panel">

      <h2 class="panel-title">HTML kod</h2>

      <textarea
        id="htmlInput"
        spellcheck="false"
        placeholder="Ovde nalepi HTML kod porudžbenice..."
      ></textarea>

      <div class="toolbar">
        <button type="button" class="primary" onclick="renderHtml()">
          Prikaži
        </button>

        <button type="button" class="light" onclick="loadExample()">
          Primer
        </button>

        <button type="button" class="red" onclick="clearAll()">
          Obriši
        </button>
      </div>

      <div class="notice">
        Nalepi HTML kod porudžbenice i klikni „Prikaži“.
      </div>

    </section>

    <!-- DESNA STRANA -->
    <section class="panel">

      <div class="toolbar preview-toolbar">

        <button
          type="button"
          class="light format-button"
          onclick="execCmd('bold')"
          title="Podebljano"
        >
          B
        </button>

        <button
          type="button"
          class="light format-button"
          onclick="execCmd('italic')"
          title="Kurziv"
        >
          I
        </button>

        <button
          type="button"
          class="light format-button"
          onclick="execCmd('underline')"
          title="Podvučeno"
        >
          U
        </button>

        <button
          type="button"
          class="light format-button"
          onclick="changeSelectedFontSize('increase')"
        >
          A+
        </button>

        <button
          type="button"
          class="light format-button"
          onclick="changeSelectedFontSize('decrease')"
        >
          A-
        </button>

        <button type="button" class="light" onclick="addRow()">
          + Red
        </button>

        <button type="button" class="light" onclick="removeRow()">
          - Red
        </button>

        <button type="button" class="dark" onclick="downloadPdf()">
          Preuzmi PDF
        </button>

        <button type="button" class="primary" onclick="saveHtml()">
          Sačuvaj HTML
        </button>

      </div>

      <div
        id="preview"
        class="document-page"
        contenteditable="true"
        spellcheck="false"
      >
        Ovde će se prikazati porudžbenica.
      </div>

      <div class="notice">
        Tekst i podatke sa desne strane možeš direktno menjati pre preuzimanja.
      </div>

    </section>

  </div>
</div>

<script>
const htmlInput = document.getElementById("htmlInput");
const preview = document.getElementById("preview");

const example = `
<h1>Otpremnica - Bazenska hemija</h1>

<div class="shop-success-box">
  <strong>Broj porudžbine:</strong> BH-20260728-142449-535<br>
  <strong>Datum:</strong> 28. 7. 2026. 14:24:49<br>
  <strong>Status:</strong>
</div>

<div class="shop-success-box">
  <strong>Kupac:</strong> Dejan Ristić<br>
  <strong>Telefon:</strong> 062760276<br>
  <strong>Email:</strong> dekipuma@mts.rs<br>
  <strong>Mesto / grad:</strong> Vladičin Han<br>
  <strong>Poštanski broj:</strong> 17510<br>
  <strong>Ulica i broj:</strong> Ivana Milutinovića 3<br>
  <strong>Ulaz / sprat / stan:</strong> 3
</div>

<table class="shop-success-table">
  <thead>
    <tr>
      <th>Proizvod</th>
      <th>Količina</th>
      <th>Ukupno sa PDV-om</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>Flokulant gel za bazene</td>
      <td>10</td>
      <td>7.590 RSD</td>
    </tr>

    <tr>
      <td>Gel za čišćenje</td>
      <td>1</td>
      <td>2.184 RSD</td>
    </tr>
  </tbody>
</table>

<div class="shop-success-total">
  Ukupno: 9.774 RSD
</div>
`;

/*
  Uklanja opasne i nepotrebne elemente.
  Originalni <style> se ne koristi, kako bi svaka
  porudžbenica imala isti izgled.
*/
function cleanPastedHtml(source) {
  const parser = new DOMParser();
  const documentObject = parser.parseFromString(source, "text/html");

  documentObject
    .querySelectorAll(
      "script, style, link, meta, iframe, object, embed, base"
    )
    .forEach(element => element.remove());

  documentObject.body.querySelectorAll("*").forEach(element => {
    Array.from(element.attributes).forEach(attribute => {
      const name = attribute.name.toLowerCase();
      const value = attribute.value.trim().toLowerCase();

      if (
        name.startsWith("on") ||
        name === "contenteditable" ||
        name === "id" ||
        name === "style"
      ) {
        element.removeAttribute(attribute.name);
      }

      if (
        (name === "href" || name === "src") &&
        value.startsWith("javascript:")
      ) {
        element.removeAttribute(attribute.name);
      }
    });
  });

  return documentObject.body.innerHTML;
}

/*
  Prepoznaje glavne delove porudžbenice čak i kada
  originalni HTML nema sve odgovarajuće klase.
*/
function normalizeDocument() {
  const tables = preview.querySelectorAll("table");

  tables.forEach(table => {
    table.classList.add("shop-success-table");
  });

  preview.querySelectorAll("div, p").forEach(element => {
    const text = element.textContent
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();

    if (
      text.startsWith("ukupno:") ||
      text.startsWith("ukupno sa pdv") ||
      text.startsWith("ukupan iznos")
    ) {
      element.classList.add("shop-success-total");
    }

    if (
      text.includes("broj porudžbine") &&
      !element.classList.contains("shop-success-box")
    ) {
      element.classList.add("order-info-box");
    }

    if (
      text.includes("kupac:") &&
      !element.classList.contains("shop-success-box")
    ) {
      element.classList.add("customer-info-box");
    }
  });

  const firstHeading = preview.querySelector("h1, h2, h3");

  if (!firstHeading) {
    const heading = document.createElement("h1");
    heading.textContent = "Otpremnica - Bazenska hemija";
    preview.prepend(heading);
  }
}

function renderHtml() {
  const source = htmlInput.value.trim();

  if (!source) {
    alert("Nalepi HTML kod porudžbenice.");
    htmlInput.focus();
    return;
  }

  preview.innerHTML = cleanPastedHtml(source);
  normalizeDocument();
}

function execCmd(command) {
  preview.focus();
  document.execCommand(command, false, null);
}

function changeSelectedFontSize(direction) {
  preview.focus();

  const selection = window.getSelection();

  if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
    alert("Prvo označi tekst koji želiš da promeniš.");
    return;
  }

  const temporarySize = direction === "increase" ? "5" : "2";
  const finalSize = direction === "increase" ? "18px" : "10px";

  document.execCommand("fontSize", false, temporarySize);

  preview.querySelectorAll(`font[size="${temporarySize}"]`).forEach(font => {
    font.removeAttribute("size");
    font.style.fontSize = finalSize;
  });
}

function getEditableTable() {
  return preview.querySelector("table");
}

function addRow() {
  const table = getEditableTable();

  if (!table) {
    alert("U dokumentu nema tabele.");
    return;
  }

  const columnCount =
    table.rows.length > 0
      ? table.rows[0].cells.length
      : 3;

  let body = table.tBodies[0];

  if (!body) {
    body = document.createElement("tbody");
    table.appendChild(body);
  }

  const row = body.insertRow(-1);

  for (let index = 0; index < columnCount; index++) {
    const cell = row.insertCell(index);

    if (index === 0) {
      cell.textContent = "Novi proizvod";
    } else if (index === 1) {
      cell.textContent = "1";
    } else {
      cell.textContent = "0 RSD";
    }
  }
}

function removeRow() {
  const table = getEditableTable();

  if (!table) {
    alert("U dokumentu nema tabele.");
    return;
  }

  const body = table.tBodies[0];

  if (!body || body.rows.length <= 1) {
    alert("Mora ostati najmanje jedan proizvod.");
    return;
  }

  body.deleteRow(body.rows.length - 1);
}

function createDocumentHtml(content) {
  return `<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Otpremnica</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  background: #ffffff;
  color: #0a233c;
  font-family: Arial, Helvetica, sans-serif;
}

.document-page {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  color: #0a233c;
  font-size: 13px;
  line-height: 1.45;
}

.document-page h1 {
  margin: 0 0 18px;
  color: #071f38;
  font-size: 24px;
  line-height: 1.25;
  font-weight: 900;
}

.document-page .shop-success-box,
.document-page .order-info-box,
.document-page .customer-info-box {
  margin: 0 0 14px;
  padding: 14px;
  border: 1px solid #d3e5eb;
  border-radius: 10px;
  background: #f7fbfd;
  line-height: 1.5;
}

.document-page table {
  width: 100%;
  margin-top: 14px;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 12px;
}

.document-page th,
.document-page td {
  padding: 8px 10px;
  border: 1px solid #d2e3e9;
  vertical-align: middle;
  overflow-wrap: anywhere;
}

.document-page th {
  background: #edf9fc;
  font-weight: 800;
  text-align: left;
}

.document-page th:nth-child(1),
.document-page td:nth-child(1) {
  width: 43%;
  text-align: left;
}

.document-page th:nth-child(2),
.document-page td:nth-child(2) {
  width: 19%;
  text-align: right;
}

.document-page th:nth-child(3),
.document-page td:nth-child(3) {
  width: 38%;
  text-align: right;
}

.document-page .shop-success-total,
.document-page .order-total {
  margin-top: 14px;
  color: #071f38;
  font-size: 20px;
  font-weight: 900;
  text-align: right;
}

@media print {
  @page {
    size: A4 portrait;
    margin: 12mm;
  }

  body {
    padding: 0;
  }
}
</style>
</head>

<body>
<main class="document-page">
${content}
</main>
</body>
</html>`;
}

function saveHtml() {
  const content = preview.innerHTML.trim();

  if (!content) {
    alert("Nema sadržaja za čuvanje.");
    return;
  }

  const finalHtml = createDocumentHtml(content);
  const blob = new Blob(
    [finalHtml],
    { type: "text/html;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = createFilename("otpremnica", "html");

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function createFilename(baseName, extension) {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");

  return `${baseName}-${year}-${month}-${day}-${hours}-${minutes}.${extension}`;
}

async function downloadPdf() {
  const content = preview.textContent.trim();

  if (!content || content === "Ovde će se prikazati porudžbenica.") {
    alert("Prvo prikaži porudžbenicu.");
    return;
  }

  /*
    Ako biblioteka nije učitana, koristi se standardni
    prozor za štampanje kao rezervna opcija.
  */
  if (typeof window.html2pdf !== "function") {
    fallbackPrint();
    return;
  }

  preview.classList.add("pdf-mode");
  preview.removeAttribute("contenteditable");

  const options = {
    margin: [8, 8, 8, 8],
    filename: createFilename("otpremnica", "pdf"),

    image: {
      type: "jpeg",
      quality: 0.98
    },

    html2canvas: {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff",
      logging: false
    },

    jsPDF: {
      unit: "mm",
      format: "a4",
      orientation: "portrait"
    },

    pagebreak: {
      mode: ["css", "legacy"],
      avoid: [
        "table",
        "tr",
        ".shop-success-box",
        ".shop-success-total"
      ]
    }
  };

  try {
    await window.html2pdf()
      .set(options)
      .from(preview)
      .save();
  } catch (error) {
    console.error("Greška pri kreiranju PDF-a:", error);
    fallbackPrint();
  } finally {
    preview.classList.remove("pdf-mode");
    preview.setAttribute("contenteditable", "true");
  }
}

function fallbackPrint() {
  const originalTitle = document.title;
  document.title = "otpremnica";

  window.print();

  setTimeout(() => {
    document.title = originalTitle;
  }, 500);
}

function loadExample() {
  htmlInput.value = example.trim();
  renderHtml();
}

function clearAll() {
  htmlInput.value = "";
  preview.innerHTML = "Ovde će se prikazati porudžbenica.";
  htmlInput.focus();
}

/*
  CTRL + ENTER prikazuje nalepljeni HTML.
*/
htmlInput.addEventListener("keydown", event => {
  if (event.ctrlKey && event.key === "Enter") {
    event.preventDefault();
    renderHtml();
  }
});
</script>

</body>
</html>
