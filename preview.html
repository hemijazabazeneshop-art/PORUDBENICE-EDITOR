<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>HemijaZaBazeneShop – Otpremnica</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Arial,sans-serif;background:#f4fafc;color:#071f38}
.app{max-width:1220px;margin:0 auto;padding:31px 17px 68px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:stretch}
.panel{min-width:0;background:#fff;border:1px solid #d6e6ec;border-radius:15px;padding:14px}
.left-panel{display:flex;flex-direction:column}
h2{margin:14px 0 16px;font-size:21px;line-height:1.2}
textarea{display:block;width:100%;height:541px;border:1px solid #cfdee5;border-radius:0;padding:8px 11px;font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.22;resize:none;outline:none;color:#111;background:#fff}
textarea:focus{border-color:#08b6d4}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0}
.right-toolbar{margin:9px 0 10px}

.primary{background:#08b6d4;color:#fff}.dark{background:#071f38;color:#fff}.red{background:#ef4444;color:#fff}.light{background:#e8f7fb;color:#07527e}
.small{min-width:31px;padding-left:8px;padding-right:8px}
.notice{margin-top:9px;padding:8px 9px;background:#fff8e8;border:1px solid #f1d58b;border-radius:9px;font-size:10px;line-height:1.35;color:#142d43}
.notice.success{background:#eefbf4;border-color:#b9e7ca;color:#155d32}
.notice.warning{background:#fff8e8;border-color:#f1d58b;color:#7a4d00}
#preview{height:634px;border:1px solid #d2e2e8;border-radius:10px;padding:16px 18px 24px;overflow:auto;background:#fff;outline:none;color:#0a233c;font-size:12px;line-height:1.45}
#preview:focus{border-color:#08b6d4}

/* Standardni izgled otpremnice */
#preview h1{margin:0 0 14px!important;font-size:22px!important;line-height:1.25!important;font-weight:800!important;color:#071f38!important}
#preview p{margin:3px 0!important}
#preview .shop-success-box{margin:0 0 12px!important;padding:13px 12px!important;border:1px solid #d2e4ea!important;border-radius:9px!important;background:#f6fbfd!important;line-height:1.5!important;color:#0a233c!important}
#preview .shop-success-box strong{font-weight:800!important}
#preview table{width:100%!important;margin:14px 0 0!important;border-collapse:collapse!important;border-spacing:0!important;table-layout:fixed!important;font-size:11px!important;color:#0a233c!important}
#preview table th,#preview table td{border:1px solid #d1e2e8!important;padding:6px 8px!important;vertical-align:middle!important;overflow-wrap:anywhere!important}
#preview table th{background:#edf9fc!important;font-weight:700!important;text-align:left!important}
#preview table th:nth-child(1),#preview table td:nth-child(1){width:43%!important;text-align:left!important}
#preview table th:nth-child(2),#preview table td:nth-child(2){width:19%!important;text-align:right!important}
#preview table th:nth-child(3),#preview table td:nth-child(3){width:38%!important;text-align:right!important}
#preview .shop-success-total{margin:12px 0 0!important;text-align:right!important;font-size:19px!important;line-height:1.2!important;font-weight:900!important;color:#071f38!important}
#preview .shop-success-total small{font-size:9px!important;font-weight:700!important}

@media(max-width:900px){.app{padding:12px}.layout{grid-template-columns:1fr}textarea{height:450px}#preview{height:650px}}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  .left-panel,.toolbar,.notice{display:none!important}
  .app,.panel{margin:0!important;padding:0!important;border:0!important;max-width:none!important}
  .layout{display:block!important}
  #preview{height:auto!important;overflow:visible!important;border:0!important;padding:0!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="layout">
    <div class="panel left-panel">
      <h2>HTML kod</h2>
      <textarea id="htmlInput" spellcheck="false" placeholder="Nalepi bilo koji HTML kod porudžbenice..."></textarea>
      <div class="toolbar">
        <button class="primary" onclick="renderHtml()">Pretvori u otpremnicu</button>
        <button class="light" onclick="loadExample()">Primer</button>
        <button class="red" onclick="clearAll()">Obriši</button>
      </div>
      <div class="notice">Program čita podatke iz različitih HTML struktura i zatim pravi novu, standardizovanu otpremnicu.</div>
    </div>

    <div class="panel">
      <div class="toolbar right-toolbar">
        <button class="light small" onclick="execCmd('bold')">B</button>
        <button class="light small" onclick="execCmd('italic')">I</button>
        <button class="light small" onclick="execCmd('underline')">U</button>
        <button class="light small" onclick="changeSize(1)">A+</button>
        <button class="light small" onclick="changeSize(-1)">A-</button>
        <button class="light" onclick="addRow()">+ Red</button>
        <button class="light" onclick="removeRow()">- Red</button>
        <button class="dark" onclick="downloadPdf()">Preuzmi PDF</button>
        <button class="primary" onclick="saveHtml()">Sačuvaj HTML</button>
      </div>
      <div id="preview" contenteditable="true" spellcheck="false">Ovde će se prikazati otpremnica.</div>
      <div id="resultNotice" class="notice">Nalepi kod levo i klikni „Pretvori u otpremnicu“.</div>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('htmlInput');
const preview = document.getElementById('preview');
const resultNotice = document.getElementById('resultNotice');

const example = `<!doctype html>
<html lang="sr">
<body>
<section>
  <p><b>Broj porudžbine:</b> BH-20260728-142449-535</p>
  <p><b>Datum:</b> 28. 7. 2026. 14:24:49</p>
  <p><b>Status:</b> Nova porudžbina</p>
</section>
<section>
  <p><b>Kupac:</b> Dejan Ristić</p>
  <p><b>Telefon:</b> 062760276</p>
  <p><b>Email:</b> dekipuma@mts.rs</p>
  <p><b>Mesto / grad:</b> Vladičin Han</p>
  <p><b>Poštanski broj:</b> 17510</p>
  <p><b>Ulica i broj:</b> Ivana Milutinovića 3</p>
  <p><b>Ulaz / sprat / stan:</b> 3</p>
</section>
<table>
  <tr><th>Naziv artikla</th><th>Kom.</th><th>Iznos</th></tr>
  <tr><td>Flokulant gel za bazene</td><td>10</td><td>7.590 RSD</td></tr>
  <tr><td>Gel za čišćenje</td><td>1</td><td>2.184 RSD</td></tr>
  <tr><td colspan="2">Ukupno</td><td>9.774 RSD</td></tr>
</table>
</body>
</html>`;

const FIELD_ALIASES = {
  orderNo: ['broj porudzbine','broj narudzbine','broj narucivanja','order number','order no','order id','id porudzbine','narudzbina broj','porudzbina broj'],
  date: ['datum porudzbine','datum narudzbine','datum i vreme','datum','order date','date'],
  status: ['status porudzbine','status narudzbine','status'],
  customer: ['ime i prezime','ime kupca','naziv kupca','kupac','narucilac','primalac','customer','billing name'],
  phone: ['broj telefona','telefon kupca','telefon','phone','tel'],
  email: ['email adresa','e mail adresa','email','e mail'],
  city: ['mesto grad','grad mesto','mesto','grad','city','town'],
  postal: ['postanski broj','zip code','postal code','zip'],
  address: ['ulica i broj','adresa isporuke','adresa kupca','adresa','address'],
  apartment: ['ulaz sprat stan','ulaz i sprat','sprat i stan','ulaz','sprat stan','apartment']
};

const HEADER_ALIASES = {
  product: ['proizvod','artikal','naziv artikla','naziv proizvoda','stavka','opis','product','item'],
  quantity: ['kolicina','komada','kom','qty','quantity'],
  total: ['ukupno sa pdv om','ukupna cena','ukupno','iznos','total','line total'],
  price: ['jedinicna cena','cena','cijena','price','unit price']
};

function normalize(value){
  return String(value || '')
    .toLowerCase()
    .replace(/đ/g,'dj')
    .replace(/[čć]/g,'c')
    .replace(/š/g,'s')
    .replace(/ž/g,'z')
    .replace(/&nbsp;/g,' ')
    .replace(/[^a-z0-9@./+\- ]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function cleanText(value){
  return String(value || '').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function canonicalField(label){
  const n = normalize(label).replace(/[:\-]+$/,'').trim();
  const entries = Object.entries(FIELD_ALIASES);
  for(const [key, aliases] of entries){
    const sorted = [...aliases].sort((a,b)=>b.length-a.length);
    if(sorted.some(alias => n === alias || n.startsWith(alias + ' '))) return key;
  }
  return null;
}

function headerType(label){
  const n = normalize(label);
  for(const [type, aliases] of Object.entries(HEADER_ALIASES)){
    if(aliases.some(alias => n === alias || n.includes(alias))) return type;
  }
  return null;
}

function textAfterLabelNode(node){
  let out = '';
  let current = node.nextSibling;
  while(current){
    if(current.nodeType === Node.ELEMENT_NODE && current.tagName === 'BR') break;
    out += current.textContent || '';
    current = current.nextSibling;
  }
  return cleanText(out.replace(/^\s*[:\-]\s*/,''));
}

function getPlainLines(root){
  const clone = root.cloneNode(true);
  clone.querySelectorAll('script,style,noscript,iframe,svg,canvas').forEach(el=>el.remove());
  clone.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  clone.querySelectorAll('tr').forEach(tr=>tr.append('\n'));
  clone.querySelectorAll('td,th').forEach(cell=>cell.append('\t'));
  clone.querySelectorAll('p,div,section,article,header,footer,li,dt,dd,h1,h2,h3,h4').forEach(el=>{
    el.prepend('\n');
    el.append('\n');
  });
  return (clone.textContent || '')
    .split(/\n+/)
    .map(cleanText)
    .filter(Boolean);
}

function extractFields(doc){
  const fields = {};
  const setField = (key, value) => {
    const v = cleanText(value);
    if(key && v && !fields[key]) fields[key] = v;
  };

  /* Tabele sa poljima tipa: <td>Kupac</td><td>Ime</td> */
  doc.querySelectorAll('tr').forEach(row=>{
    const cells = [...row.cells].map(cell=>cleanText(cell.textContent));
    if(cells.length >= 2){
      const key = canonicalField(cells[0]);
      if(key) setField(key, cells.slice(1).join(' '));
    }
  });

  /* Definition liste: <dt>Kupac</dt><dd>Ime</dd> */
  doc.querySelectorAll('dt').forEach(dt=>{
    const key = canonicalField(dt.textContent);
    if(key){
      const dd = dt.nextElementSibling;
      if(dd && dd.tagName === 'DD') setField(key, dd.textContent);
    }
  });

  /* Najčešći oblik: <strong>Kupac:</strong> Ime */
  doc.querySelectorAll('strong,b,label,th').forEach(labelNode=>{
    const key = canonicalField(labelNode.textContent);
    if(!key) return;
    let value = textAfterLabelNode(labelNode);
    if(!value && labelNode.parentElement){
      const parentText = cleanText(labelNode.parentElement.textContent);
      const labelText = cleanText(labelNode.textContent);
      value = cleanText(parentText.slice(parentText.indexOf(labelText) + labelText.length).replace(/^\s*[:\-]\s*/,''));
    }
    setField(key, value);
  });

  /* Rezervni način: čitanje linija Labela: vrednost */
  getPlainLines(doc.body).forEach(line=>{
    const colon = line.indexOf(':');
    if(colon > 0){
      const key = canonicalField(line.slice(0, colon));
      if(key) setField(key, line.slice(colon + 1));
    }
  });

  return fields;
}

function scoreAndDescribeTable(table){
  const rows = [...table.rows];
  if(rows.length < 2) return null;

  let bestHeader = null;
  const maxHeaderRows = Math.min(rows.length, 4);

  for(let r = 0; r < maxHeaderRows; r++){
    const texts = [...rows[r].cells].map(cell=>cleanText(cell.textContent));
    const types = texts.map(headerType);
    const productIndex = types.indexOf('product');
    const quantityIndex = types.indexOf('quantity');
    const totalIndex = types.indexOf('total');
    const priceIndex = types.indexOf('price');
    let score = 0;
    if(productIndex >= 0) score += 6;
    if(quantityIndex >= 0) score += 4;
    if(totalIndex >= 0) score += 5;
    if(priceIndex >= 0) score += 3;
    if(score > (bestHeader?.score || 0)){
      bestHeader = {rowIndex:r, texts, productIndex, quantityIndex, totalIndex, priceIndex, score};
    }
  }

  if(bestHeader && bestHeader.score >= 10){
    return {...bestHeader, table, overallScore:bestHeader.score + Math.min(rows.length,10)};
  }

  /* Tabela bez zaglavlja: najmanje 3 kolone, broj u drugoj i cena u poslednjoj. */
  let inferredRows = 0;
  for(const row of rows){
    const cells = [...row.cells].map(cell=>cleanText(cell.textContent));
    if(cells.length >= 3 && cells[0] && /^\d+(?:[.,]\d+)?$/.test(cells[1]) && /\d/.test(cells[cells.length-1])) inferredRows++;
  }
  if(inferredRows >= 2){
    return {table,rowIndex:-1,productIndex:0,quantityIndex:1,totalIndex:rows[0].cells.length-1,priceIndex:-1,overallScore:8+inferredRows};
  }

  return null;
}

function isSummaryRow(name){
  const n = normalize(name);
  return ['ukupno','subtotal','medjuzbir','porez','pdv','dostava','shipping','popust','discount'].some(x=>n === x || n.startsWith(x + ' '));
}

function extractItems(doc){
  const candidates = [...doc.querySelectorAll('table')]
    .map(scoreAndDescribeTable)
    .filter(Boolean)
    .sort((a,b)=>b.overallScore-a.overallScore);

  if(!candidates.length) return [];

  const best = candidates[0];
  const rows = [...best.table.rows].slice(best.rowIndex + 1);
  const items = [];

  rows.forEach(row=>{
    const cells = [...row.cells].map(cell=>cleanText(cell.textContent));
    if(!cells.length) return;
    const name = cells[best.productIndex] || '';
    if(!name || isSummaryRow(name)) return;

    const quantity = cells[best.quantityIndex] || '1';
    const selectedPriceIndex = best.totalIndex >= 0 ? best.totalIndex : best.priceIndex;
    const price = selectedPriceIndex >= 0 ? (cells[selectedPriceIndex] || '') : '';

    /* Preskoči zaglavlje koje je možda ostalo u tabeli bez TH elemenata. */
    if(headerType(name) === 'product') return;

    items.push({name, quantity:quantity || '1', total:price});
  });

  return items;
}

function extractTotal(doc, items){
  /* Prvo traži red tabele sa oznakom Ukupno. */
  for(const row of doc.querySelectorAll('tr')){
    const cells = [...row.cells].map(cell=>cleanText(cell.textContent));
    if(cells.length >= 2 && isSummaryRow(cells[0]) && normalize(cells[0]).startsWith('ukupno')){
      const value = [...cells].reverse().find(cell=>/\d/.test(cell));
      if(value) return value;
    }
  }

  /* Zatim traži tekstualnu liniju "Ukupno: 9.774 RSD". */
  for(const line of getPlainLines(doc.body)){
    const n = normalize(line);
    if((n.startsWith('ukupno') || n.startsWith('ukupan iznos') || n.startsWith('total')) && /\d/.test(line)){
      const afterColon = line.includes(':') ? line.slice(line.indexOf(':') + 1) : line.replace(/^[^0-9]*/, '');
      const value = cleanText(afterColon);
      if(value) return value;
    }
  }

  /* Ako ukupno nije navedeno, sabira prepoznate RSD iznose. */
  const numbers = items.map(item=>parseMoney(item.total)).filter(Number.isFinite);
  if(numbers.length === items.length && numbers.length){
    const sum = numbers.reduce((a,b)=>a+b,0);
    return new Intl.NumberFormat('sr-RS',{maximumFractionDigits:2}).format(sum) + ' RSD';
  }
  return '';
}

function parseMoney(value){
  let s = cleanText(value).replace(/[^0-9,.-]/g,'');
  if(!s) return NaN;
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if(hasComma && hasDot){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  }else if(hasComma){
    const parts = s.split(',');
    s = parts[parts.length-1].length === 3 ? parts.join('') : s.replace(',','.');
  }else if(hasDot){
    const parts = s.split('.');
    if(parts.length > 2 || parts[parts.length-1].length === 3) s = parts.join('');
  }
  return Number(s);
}

function parseOrder(html){
  const doc = new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,noscript,iframe,object,embed,svg,canvas').forEach(el=>el.remove());
  const fields = extractFields(doc);
  const items = extractItems(doc);
  const total = extractTotal(doc, items);
  return {fields, items, total};
}

function row(label, value){
  return `<strong>${escapeHtml(label)}:</strong> ${escapeHtml(value || '')}<br>`;
}

function buildOtpremnica(data){
  const f = data.fields;
  const itemRows = data.items.length
    ? data.items.map(item=>`<tr><td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.quantity)}</td><td>${escapeHtml(item.total)}</td></tr>`).join('')
    : `<tr><td>Proizvod nije automatski prepoznat</td><td>1</td><td></td></tr>`;

  return `
    <h1>Otpremnica - Bazenska hemija</h1>

    <div class="shop-success-box">
      ${row('Broj porudžbine', f.orderNo)}
      ${row('Datum', f.date)}
      <strong>Status:</strong> ${escapeHtml(f.status || '')}
    </div>

    <div class="shop-success-box">
      ${row('Kupac', f.customer)}
      ${row('Telefon', f.phone)}
      ${row('Email', f.email)}
      ${row('Mesto / grad', f.city)}
      ${row('Poštanski broj', f.postal)}
      ${row('Ulica i broj', f.address)}
      <strong>Ulaz / sprat / stan:</strong> ${escapeHtml(f.apartment || '')}
    </div>

    <table class="shop-success-table">
      <thead><tr><th>Proizvod</th><th>Količina</th><th>Ukupno sa PDV-om</th></tr></thead>
      <tbody>${itemRows}</tbody>
    </table>

    <div class="shop-success-total">Ukupno: ${escapeHtml(data.total || '')}<small> sa pdv</small></div>`;
}

function renderHtml(){
  const html = input.value.trim();
  if(!html){alert('Nalepi HTML kod porudžbenice.');return;}

  const data = parseOrder(html);
  preview.innerHTML = buildOtpremnica(data);

  const fieldCount = Object.values(data.fields).filter(Boolean).length;
  const productCount = data.items.length;
  const missing = [];
  if(!data.fields.customer) missing.push('kupac');
  if(!data.fields.address) missing.push('adresa');
  if(!productCount) missing.push('proizvodi');
  if(!data.total) missing.push('ukupno');

  resultNotice.className = missing.length ? 'notice warning' : 'notice success';
  resultNotice.textContent = `Prepoznato: ${fieldCount} polja i ${productCount} proizvoda.` +
    (missing.length ? ` Nije prepoznato: ${missing.join(', ')}. Te podatke možeš dopisati desno.` : ' Otpremnica je spremna.');
}

function execCmd(cmd){preview.focus();document.execCommand(cmd,false,null)}

function changeSize(direction){
  preview.focus();
  const selection = window.getSelection();
  if(!selection || selection.isCollapsed){alert('Prvo označi tekst.');return;}
  const size = direction > 0 ? 5 : 2;
  document.execCommand('fontSize',false,size);
  preview.querySelectorAll(`font[size="${size}"]`).forEach(f=>{
    f.removeAttribute('size');
    f.style.fontSize = direction > 0 ? '18px' : '10px';
  });
}

function addRow(){
  const table = preview.querySelector('table');
  if(!table){alert('Nema tabele.');return;}
  const body = table.tBodies[0] || table.appendChild(document.createElement('tbody'));
  const row = body.insertRow(-1);
  ['Novi proizvod','1','0 RSD'].forEach(value=>row.insertCell(-1).textContent=value);
}

function removeRow(){
  const body = preview.querySelector('table')?.tBodies[0];
  if(!body){alert('Nema tabele.');return;}
  if(body.rows.length <= 1){alert('Mora ostati najmanje jedan proizvod.');return;}
  body.deleteRow(body.rows.length - 1);
}

function documentCss(){
  return `*{box-sizing:border-box}body{margin:0;padding:28px;font-family:Arial,sans-serif;color:#0a233c;background:#fff}.document{max-width:800px;margin:auto;font-size:13px;line-height:1.45}.document h1{margin:0 0 18px;font-size:24px;color:#071f38}.shop-success-box{margin:0 0 14px;padding:14px;border:1px solid #d2e4ea;border-radius:10px;background:#f6fbfd;line-height:1.5}.document table{width:100%;margin-top:14px;border-collapse:collapse;table-layout:fixed;font-size:12px}.document th,.document td{border:1px solid #d1e2e8;padding:8px 10px}.document th{background:#edf9fc;text-align:left}.document th:nth-child(1),.document td:nth-child(1){width:43%;text-align:left}.document th:nth-child(2),.document td:nth-child(2){width:19%;text-align:right}.document th:nth-child(3),.document td:nth-child(3){width:38%;text-align:right}.shop-success-total{margin-top:14px;text-align:right;font-size:20px;font-weight:900}.shop-success-total small{font-size:9px}@media print{@page{size:A4 portrait;margin:12mm}body{padding:0}}`;
}

function saveHtml(){
  const html = `<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Otpremnica</title><style>${documentCss()}</style></head><body><main class="document">${preview.innerHTML}</main></body></html>`;
  const blob = new Blob([html],{type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'otpremnica.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}

function downloadPdf(){
  const old = document.title;
  document.title = 'otpremnica';
  window.print();
  setTimeout(()=>document.title=old,500);
}

function loadExample(){input.value=example;renderHtml()}
function clearAll(){
  input.value='';
  preview.textContent='Ovde će se prikazati otpremnica.';
  resultNotice.className='notice';
  resultNotice.textContent='Nalepi kod levo i klikni „Pretvori u otpremnicu“.';
}

input.addEventListener('keydown',event=>{
  if(event.ctrlKey && event.key === 'Enter'){
    event.preventDefault();
    renderHtml();
  }
});

loadExample();
</script>
