<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Editor otpremnice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f9fb;
  color:#071f38;
}
.app{
  max-width:1220px;
  margin:0 auto;
  padding:30px 17px;
}
.layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.panel{
  background:#fff;
  border:1px solid #d6e7ed;
  border-radius:15px;
  padding:14px;
}
.left-panel{display:flex;flex-direction:column}
h2{
  margin:14px 0 16px;
  font-size:21px;
  line-height:1.2;
}
#htmlInput{
  width:100%;
  height:541px;
  padding:10px 12px;
  border:1px solid #d2e2e8;
  border-radius:10px;
  outline:none;
  resize:vertical;
  color:#071f38;
  background:#fff;
  font-family:Consolas,Monaco,"Courier New",monospace;
  font-size:12px;
  line-height:1.35;
  tab-size:2;
}
#htmlInput:focus,#preview:focus{
  border-color:#08b6d4;
  box-shadow:0 0 0 3px rgba(8,182,212,.09);
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
  margin:10px 0;
}
.preview-toolbar{margin-top:9px;margin-bottom:10px}
button{
  border:0;
  min-height:30px;
  padding:7px 12px;
  border-radius:9px;
  cursor:pointer;
  font-size:11px;
  font-weight:800;
}
button:hover{filter:brightness(.97)}
.primary{background:#08b6d4;color:#fff}
.dark{background:#071f38;color:#fff}
.red{background:#ef4444;color:#fff}
.light{background:#e8f7fb;color:#07527e}
.small-btn{min-width:31px;padding-left:8px;padding-right:8px}
.notice{
  margin-top:9px;
  padding:8px 9px;
  border:1px solid #f2d792;
  border-radius:9px;
  background:#fff8e7;
  color:#19344d;
  font-size:10px;
  line-height:1.4;
}
#preview{
  min-height:635px;
  padding:16px 18px 28px;
  border:1px solid #d3e3e9;
  border-radius:11px;
  background:#fff;
  color:#0a233c;
  font-size:12px;
  line-height:1.45;
  outline:none;
}
#preview h1{
  margin:0 0 14px;
  color:#071f38;
  font-size:22px;
  line-height:1.25;
  font-weight:900;
}
.otpremnica-box{
  margin:0 0 12px;
  padding:13px 12px;
  border:1px solid #d3e5eb;
  border-radius:10px;
  background:#f7fbfd;
  line-height:1.48;
}
.otpremnica-box strong{font-weight:800}
.otpremnica-table{
  width:100%;
  margin:13px 0 0;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:11px;
}
.otpremnica-table th,.otpremnica-table td{
  padding:7px 9px;
  border:1px solid #d2e3e9;
  vertical-align:middle;
  overflow-wrap:anywhere;
}
.otpremnica-table th{
  background:#edf9fc;
  color:#092844;
  font-weight:800;
  text-align:left;
}
.otpremnica-table th:nth-child(1),.otpremnica-table td:nth-child(1){width:43%;text-align:left}
.otpremnica-table th:nth-child(2),.otpremnica-table td:nth-child(2){width:19%;text-align:right}
.otpremnica-table th:nth-child(3),.otpremnica-table td:nth-child(3){width:38%;text-align:right}
.otpremnica-total{
  margin:12px 0 0;
  text-align:right;
  color:#071f38;
  font-size:19px;
  line-height:1.3;
  font-weight:900;
}
.otpremnica-total small{font-size:9px;font-weight:700}
.empty-state{color:#52677a}
.pdf-mode{
  width:190mm!important;
  min-height:auto!important;
  padding:8mm!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
}
@media(max-width:900px){
  .app{padding:12px}
  .layout{grid-template-columns:1fr}
  #htmlInput{height:430px}
}
@media(max-width:540px){
  .panel{padding:10px;border-radius:12px}
  #preview{padding:15px 10px 24px}
  #preview h1{font-size:19px}
  .otpremnica-table{font-size:9px}
  .otpremnica-table th,.otpremnica-table td{padding:6px 4px}
  button{font-size:10px;padding:7px 9px}
}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  body *{visibility:hidden!important}
  #preview,#preview *{visibility:visible!important}
  #preview{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    min-height:0;
    padding:0;
    border:0;
    border-radius:0;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="layout">
    <section class="panel left-panel">
      <h2>HTML kod</h2>
      <textarea id="htmlInput" spellcheck="false" placeholder="Nalepi HTML porudžbenice ovde..."></textarea>
      <div class="toolbar">
        <button class="primary" type="button" onclick="convertOrder()">Prikaži</button>
        <button class="light" type="button" onclick="loadExample()">Primer</button>
        <button class="red" type="button" onclick="clearAll()">Obriši</button>
      </div>
      <div class="notice">Nalepi HTML kod porudžbenice i klikni „Prikaži“.</div>
    </section>

    <section class="panel">
      <div class="toolbar preview-toolbar">
        <button class="light small-btn" type="button" onclick="execCmd('bold')">B</button>
        <button class="light small-btn" type="button" onclick="execCmd('italic')">I</button>
        <button class="light small-btn" type="button" onclick="execCmd('underline')">U</button>
        <button class="light small-btn" type="button" onclick="changeFontSize('increase')">A+</button>
        <button class="light small-btn" type="button" onclick="changeFontSize('decrease')">A-</button>
        <button class="light" type="button" onclick="addRow()">+ Red</button>
        <button class="light" type="button" onclick="removeRow()">- Red</button>
        <button class="dark" type="button" onclick="downloadPdf()">Preuzmi PDF</button>
        <button class="primary" type="button" onclick="saveHtml()">Save HTML</button>
      </div>
      <div id="preview" contenteditable="true" spellcheck="false"><span class="empty-state">Ovde će se prikazati otpremnica.</span></div>
      <div class="notice">Za PDF koristi Chrome ili Edge. Sadržaj desno možeš ručno menjati.</div>
    </section>
  </div>
</div>

<script>
const htmlInput = document.getElementById('htmlInput');
const preview = document.getElementById('preview');

const example = `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Porudžbenica BH-20260727-065541-110</title>
</head>
<body>
<h1>Porudžbenica - Bazenska hemija</h1>
<div class="shop-success-box">
<strong>Broj porudžbine:</strong> BH-20260727-065541-110<br>
<strong>Datum:</strong> 27. 7. 2026. 06:55:41<br>
<strong>Status:</strong> Upit za porudžbinu je poslat prodavcu.
</div>
<div class="shop-success-box">
<strong>Kupac:</strong> Slobodanka Milićević<br>
<strong>Telefon:</strong> 0603234663<br>
<strong>Email:</strong> natasadjordjevic60@gmail.com<br>
<strong>Mesto / grad:</strong> Valjevo<br>
<strong>Poštanski broj:</strong> 14000<br>
<strong>Ulica i broj:</strong> Šabački Put Bb<br>
<strong>Ulaz / sprat / stan:</strong> Bb
</div>
<table class="shop-success-table">
<thead><tr><th>Proizvod</th><th>Količina</th><th>Ukupno sa PDV-om</th></tr></thead>
<tbody><tr><td>Algicid Diasa 5l</td><td>1</td><td>2.255 RSD</td></tr></tbody>
</table>
<div class="shop-success-total">Ukupno sa PDV-om: 2.255 RSD</div>
<div class="shop-success-box"><strong>PDV:</strong> Sve cene uključuju PDV.</div>
<div class="shop-success-box"><strong>Napomena:</strong> Ovo je potvrda poslatog upita.</div>
</body>
</html>`;

function firstHtmlDocument(source){
  const match = source.match(/<!doctype[\s\S]*?<\/html>/i) || source.match(/<html[\s\S]*?<\/html>/i);
  return match ? match[0] : source;
}

function parseSource(source){
  return new DOMParser().parseFromString(firstHtmlDocument(source), 'text/html');
}

function cleanText(value){
  return String(value || '').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,' ').trim();
}

function escapeHtml(value){
  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function getLabelValue(root, label){
  const normalizedLabel = label.toLocaleLowerCase('sr');
  const strongs = [...root.querySelectorAll('strong')];
  const target = strongs.find(el => cleanText(el.textContent).replace(/:$/,'').toLocaleLowerCase('sr') === normalizedLabel);
  if(!target) return '';

  let value = '';
  let node = target.nextSibling;
  while(node){
    if(node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') break;
    if(node.nodeType === Node.ELEMENT_NODE && node.tagName === 'STRONG') break;
    value += node.textContent || '';
    node = node.nextSibling;
  }
  return cleanText(value.replace(/^\s*:\s*/,''));
}

function findInfoBox(doc, requiredLabel){
  return [...doc.querySelectorAll('.shop-success-box, div, section')].find(box => {
    return [...box.querySelectorAll(':scope > strong, strong')].some(strong =>
      cleanText(strong.textContent).replace(/:$/,'').toLocaleLowerCase('sr') === requiredLabel.toLocaleLowerCase('sr')
    );
  }) || doc.body;
}

function extractItems(doc){
  const table = doc.querySelector('.shop-success-table') || doc.querySelector('table');
  if(!table) return [];

  const rows = [...table.querySelectorAll('tbody tr')];
  const sourceRows = rows.length ? rows : [...table.querySelectorAll('tr')].slice(1);

  return sourceRows.map(row => {
    const cells = [...row.querySelectorAll('td')];
    if(cells.length < 2) return null;
    return {
      product: cleanText(cells[0].textContent),
      quantity: cleanText(cells[1].textContent),
      total: cleanText(cells[2]?.textContent || '')
    };
  }).filter(item => item && (item.product || item.quantity || item.total));
}

function extractTotal(doc, items){
  const totalElement = doc.querySelector('.shop-success-total');
  if(totalElement){
    const text = cleanText(totalElement.textContent);
    const withoutLabel = text.replace(/^ukupno(?:\s+sa\s+pdv-?om)?\s*:\s*/i,'').trim();
    if(withoutLabel) return withoutLabel;
  }
  if(items.length === 1 && items[0].total) return items[0].total;
  return '';
}

function convertOrder(){
  const source = htmlInput.value.trim();
  if(!source){
    alert('Nalepi HTML porudžbenice.');
    htmlInput.focus();
    return;
  }

  const doc = parseSource(source);
  const orderBox = findInfoBox(doc, 'Broj porudžbine');
  const customerBox = findInfoBox(doc, 'Kupac');

  const data = {
    orderNumber: getLabelValue(orderBox, 'Broj porudžbine'),
    date: getLabelValue(orderBox, 'Datum'),
    customer: getLabelValue(customerBox, 'Kupac'),
    phone: getLabelValue(customerBox, 'Telefon'),
    email: getLabelValue(customerBox, 'Email'),
    city: getLabelValue(customerBox, 'Mesto / grad'),
    postalCode: getLabelValue(customerBox, 'Poštanski broj'),
    address: getLabelValue(customerBox, 'Ulica i broj'),
    apartment: getLabelValue(customerBox, 'Ulaz / sprat / stan')
  };

  const items = extractItems(doc);
  const total = extractTotal(doc, items);

  const rowsHtml = items.length
    ? items.map(item => `
      <tr>
        <td>${escapeHtml(item.product)}</td>
        <td>${escapeHtml(item.quantity)}</td>
        <td>${escapeHtml(item.total)}</td>
      </tr>`).join('')
    : `<tr><td>Nije pronađen proizvod</td><td></td><td></td></tr>`;

  preview.innerHTML = `
    <h1>Otpremnica - Bazenska hemija</h1>

    <div class="otpremnica-box">
      <strong>Broj porudžbine:</strong> ${escapeHtml(data.orderNumber)}<br>
      <strong>Datum:</strong> ${escapeHtml(data.date)}<br>
      <strong>Status:</strong>
    </div>

    <div class="otpremnica-box">
      <strong>Kupac:</strong> ${escapeHtml(data.customer)}<br>
      <strong>Telefon:</strong> ${escapeHtml(data.phone)}<br>
      <strong>Email:</strong> ${escapeHtml(data.email)}<br>
      <strong>Mesto / grad:</strong> ${escapeHtml(data.city)}<br>
      <strong>Poštanski broj:</strong> ${escapeHtml(data.postalCode)}<br>
      <strong>Ulica i broj:</strong> ${escapeHtml(data.address)}<br>
      <strong>Ulaz / sprat / stan:</strong> ${escapeHtml(data.apartment)}
    </div>

    <table class="otpremnica-table">
      <thead>
        <tr>
          <th>Proizvod</th>
          <th>Količina</th>
          <th>Ukupno sa PDV-om</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>

    <div class="otpremnica-total">Ukupno: ${escapeHtml(total)} <small>sa pdv</small></div>
  `;
}

function execCmd(command){
  preview.focus();
  document.execCommand(command,false,null);
}

function changeFontSize(direction){
  preview.focus();
  const selection = window.getSelection();
  if(!selection || selection.rangeCount === 0 || selection.isCollapsed){
    alert('Prvo označi tekst.');
    return;
  }
  const temporarySize = direction === 'increase' ? '5' : '2';
  const finalSize = direction === 'increase' ? '18px' : '10px';
  document.execCommand('fontSize',false,temporarySize);
  preview.querySelectorAll(`font[size="${temporarySize}"]`).forEach(font => {
    font.removeAttribute('size');
    font.style.fontSize = finalSize;
  });
}

function getTable(){
  return preview.querySelector('.otpremnica-table');
}

function addRow(){
  const table = getTable();
  if(!table){alert('Prvo napravi otpremnicu.');return;}
  let tbody = table.tBodies[0];
  if(!tbody){tbody = table.createTBody();}
  const row = tbody.insertRow(-1);
  ['Novi proizvod','1','0 RSD'].forEach(value => {
    const cell = row.insertCell(-1);
    cell.textContent = value;
  });
}

function removeRow(){
  const table = getTable();
  if(!table || !table.tBodies[0]){alert('Nema reda za brisanje.');return;}
  const tbody = table.tBodies[0];
  if(tbody.rows.length <= 1){alert('Mora ostati najmanje jedan proizvod.');return;}
  tbody.deleteRow(tbody.rows.length - 1);
}

function filename(extension){
  const numberText = preview.querySelector('.otpremnica-box')?.textContent || '';
  const match = numberText.match(/BH-[A-Z0-9-]+/i);
  const base = match ? `otpremnica-${match[0]}` : 'otpremnica';
  return `${base}.${extension}`;
}

function documentCss(){
  return `
    *{box-sizing:border-box}
    body{margin:0;padding:28px;font-family:Arial,Helvetica,sans-serif;color:#0a233c;background:#fff}
    .document{max-width:800px;margin:0 auto;font-size:13px;line-height:1.45}
    h1{margin:0 0 18px;color:#071f38;font-size:24px;line-height:1.25;font-weight:900}
    .otpremnica-box{margin:0 0 14px;padding:14px;border:1px solid #d3e5eb;border-radius:10px;background:#f7fbfd;line-height:1.5}
    .otpremnica-table{width:100%;margin-top:14px;border-collapse:collapse;table-layout:fixed;font-size:12px}
    .otpremnica-table th,.otpremnica-table td{padding:8px 10px;border:1px solid #d2e3e9;vertical-align:middle;overflow-wrap:anywhere}
    .otpremnica-table th{background:#edf9fc;font-weight:800;text-align:left}
    .otpremnica-table th:nth-child(1),.otpremnica-table td:nth-child(1){width:43%;text-align:left}
    .otpremnica-table th:nth-child(2),.otpremnica-table td:nth-child(2){width:19%;text-align:right}
    .otpremnica-table th:nth-child(3),.otpremnica-table td:nth-child(3){width:38%;text-align:right}
    .otpremnica-total{margin-top:14px;text-align:right;color:#071f38;font-size:20px;font-weight:900}
    .otpremnica-total small{font-size:9px;font-weight:700}
    @media print{@page{size:A4 portrait;margin:12mm}body{padding:0}}
  `;
}

function saveHtml(){
  if(!preview.querySelector('h1')){alert('Prvo napravi otpremnicu.');return;}
  const html = `<!doctype html><html lang="sr"><head><meta charset="utf-8"><title>Otpremnica</title><style>${documentCss()}</style></head><body><main class="document">${preview.innerHTML}</main></body></html>`;
  const blob = new Blob([html],{type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename('html');
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function downloadPdf(){
  if(!preview.querySelector('h1')){alert('Prvo napravi otpremnicu.');return;}
  if(typeof window.html2pdf !== 'function'){
    window.print();
    return;
  }
  preview.classList.add('pdf-mode');
  preview.removeAttribute('contenteditable');
  try{
    await window.html2pdf().set({
      margin:[8,8,8,8],
      filename:filename('pdf'),
      image:{type:'jpeg',quality:.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],avoid:['tr','.otpremnica-box','.otpremnica-total']}
    }).from(preview).save();
  }catch(error){
    console.error(error);
    window.print();
  }finally{
    preview.classList.remove('pdf-mode');
    preview.setAttribute('contenteditable','true');
  }
}

function loadExample(){
  htmlInput.value = example;
  convertOrder();
}

function clearAll(){
  htmlInput.value = '';
  preview.innerHTML = '<span class="empty-state">Ovde će se prikazati otpremnica.</span>';
  htmlInput.focus();
}

htmlInput.addEventListener('keydown',event => {
  if(event.ctrlKey && event.key === 'Enter'){
    event.preventDefault();
    convertOrder();
  }
});
</script>
</body>
</html>
