<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>HemijaZaBazeneShop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Arial,sans-serif;background:#f4fafc;color:#071f38}
.app{max-width:1220px;margin:0 auto;padding:31px 17px 68px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:stretch}
.panel{min-width:0;background:#fff;border:1px solid #d6e6ec;border-radius:15px;padding:14px}
.left-panel{display:flex;flex-direction:column}
h2{margin:14px 0 16px;font-size:21px;line-height:1.2}
textarea{display:block;width:100%;height:541px;border:1px solid #cfdee5;border-radius:0;padding:8px 11px;font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.22;resize:none;outline:none;color:#111;background:#fff}
textarea:focus{border-color:#08b6d4}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0}
.right-toolbar{margin:9px 0 10px}
button{border:0;padding:8px 12px;min-height:30px;border-radius:9px;cursor:pointer;font-size:11px;font-weight:700}
.primary{background:#08b6d4;color:#fff}.dark{background:#071f38;color:#fff}.red{background:#ef4444;color:#fff}.light{background:#e8f7fb;color:#07527e}
.small{min-width:31px;padding-left:8px;padding-right:8px}
.notice{margin-top:9px;padding:8px 9px;background:#fff8e8;border:1px solid #f1d58b;border-radius:9px;font-size:10px;line-height:1.35;color:#142d43}
#preview{height:634px;border:1px solid #d2e2e8;border-radius:10px;padding:16px 18px 24px;overflow:auto;background:#fff;outline:none;color:#0a233c;font-size:12px;line-height:1.45}
#preview:focus{border-color:#08b6d4}

/* OVO JE IZGLED DOKUMENTA SA DESNE STRANE */
#preview h1{margin:0 0 14px!important;font-size:22px!important;line-height:1.25!important;font-weight:800!important;color:#071f38!important}
#preview h2{margin:0 0 13px!important;font-size:18px!important}
#preview p{margin:3px 0!important}
#preview .shop-success-box,
#preview .auto-box{margin:0 0 12px!important;padding:13px 12px!important;border:1px solid #d2e4ea!important;border-radius:9px!important;background:#f6fbfd!important;line-height:1.5!important;color:#0a233c!important}
#preview .shop-success-box strong,
#preview .auto-box strong{font-weight:800!important}
#preview table,
#preview .shop-success-table{width:100%!important;margin:14px 0 0!important;border-collapse:collapse!important;border-spacing:0!important;table-layout:fixed!important;font-size:11px!important;color:#0a233c!important}
#preview table th,
#preview table td{border:1px solid #d1e2e8!important;padding:6px 8px!important;vertical-align:middle!important}
#preview table th{background:#edf9fc!important;font-weight:700!important;text-align:left!important}
#preview table th:nth-child(1),#preview table td:nth-child(1){width:43%!important;text-align:left!important}
#preview table th:nth-child(2),#preview table td:nth-child(2){width:19%!important;text-align:right!important}
#preview table th:nth-child(3),#preview table td:nth-child(3){width:38%!important;text-align:right!important}
#preview .shop-success-total,
#preview .auto-total{margin:12px 0 0!important;text-align:right!important;font-size:19px!important;line-height:1.2!important;font-weight:900!important;color:#071f38!important}
#preview img{max-width:100%!important;height:auto!important}

@media(max-width:900px){.app{padding:12px}.layout{grid-template-columns:1fr}textarea{height:450px}#preview{height:650px}}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  .left-panel,.toolbar,.notice{display:none!important}
  .app,.panel{margin:0!important;padding:0!important;border:0!important;max-width:none!important}
  .layout{display:block!important}
  #preview{height:auto!important;overflow:visible!important;border:0!important;padding:0!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="layout">
    <div class="panel left-panel">
      <h2>HTML kod</h2>
      <textarea id="htmlInput" spellcheck="true"></textarea>
      <div class="toolbar">
        <button class="primary" onclick="renderHtml()">Prikaži</button>
        <button class="light" onclick="loadExample()">Primer</button>
        <button class="red" onclick="clearAll()">Obriši</button>
      </div>
      <div class="notice">Nalepi HTML kod porudžbenice i klikni „Prikaži“.</div>
    </div>

    <div class="panel">
      <div class="toolbar right-toolbar">
        <button class="light small" onclick="execCmd('bold')">B</button>
        <button class="light small" onclick="execCmd('italic')">I</button>
        <button class="light small" onclick="execCmd('underline')">U</button>
        <button class="light small" onclick="changeSize(1)">A+</button>
        <button class="light small" onclick="changeSize(-1)">A-</button>
        <button class="light" onclick="addRow()">+ Red</button>
        <button class="light" onclick="removeRow()">- Red</button>
        <button class="dark" onclick="downloadPdf()">Preuzmi PDF</button>
        <button class="primary" onclick="saveHtml()">Save HTML</button>
      </div>
      <div id="preview" contenteditable="true" spellcheck="true">Ovde će se prikazati porudžbenica.</div>
      <div class="notice">Za PDF koristi Chrome ili Edge. Otvoriće se prozor za čuvanje PDF-a.</div>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('htmlInput');
const preview = document.getElementById('preview');

const example = `<!doctype html>
<html lang="sr">
<head><meta charset="utf-8"><style>body{color:red}.shop-success-box{background:yellow}</style></head>
<body>
<h1>Otpremnica - Bazenska hemija</h1>
<div class="shop-success-box">
<strong>Broj porudžbine:</strong> BH-20260728-142449-535<br>
<strong>Datum:</strong> 28. 7. 2026. 14:24:49<br>
<strong>Status:</strong>
</div>
<div class="shop-success-box">
<strong>Kupac:</strong> Dejan Ristić<br>
<strong>Telefon:</strong> 062760276<br>
<strong>Email:</strong> dekipuma@mts.rs<br>
<strong>Mesto / grad:</strong> Vladičin Han<br>
<strong>Poštanski broj:</strong> 17510<br>
<strong>Ulica i broj:</strong> Ivana Milutinovića 3<br>
<strong>Ulaz / sprat / stan:</strong> 3
</div>
<table class="shop-success-table">
<thead><tr><th>Proizvod</th><th>Količina</th><th>Ukupno sa PDV-om</th></tr></thead>
<tbody>
<tr><td>Flokulant gel za bazene</td><td>10</td><td>7.590 RSD</td></tr>
<tr><td>Gel za čišćenje</td><td>1</td><td>2.184 RSD</td></tr>
</tbody>
</table>
<div class="shop-success-total">Ukupno: 9.774 RSD<small> sa pdv</small></div>
</body></html>`;

function getCleanBody(html){
  const doc = new DOMParser().parseFromString(html,'text/html');

  /* Bitno: brišemo originalni CSS, jer je on ranije menjao izgled. */
  doc.querySelectorAll('style,script,link,meta,iframe,object,embed').forEach(el=>el.remove());

  doc.body.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const n=attr.name.toLowerCase();
      const v=attr.value.toLowerCase().trim();
      if(n==='style'||n==='id'||n.startsWith('on')) el.removeAttribute(attr.name);
      if((n==='href'||n==='src')&&v.startsWith('javascript:')) el.removeAttribute(attr.name);
    });
  });
  return doc.body.innerHTML;
}

function formatDocument(){
  preview.querySelectorAll('table').forEach(t=>t.classList.add('shop-success-table'));

  const table = preview.querySelector('table');
  if(table){
    let node = preview.firstElementChild;
    while(node && node !== table){
      const next = node.nextElementSibling;
      const text = node.textContent.replace(/\s+/g,' ').trim().toLowerCase();
      if(node.tagName==='DIV' && !node.classList.contains('shop-success-box') &&
         (text.includes('broj porudžbine') || text.includes('kupac:'))){
        node.classList.add('auto-box');
      }
      node = next;
    }
  }

  preview.querySelectorAll('div,p').forEach(el=>{
    const txt=el.textContent.replace(/\s+/g,' ').trim().toLowerCase();
    if(txt.startsWith('ukupno:') || txt.startsWith('ukupno sa pdv') || txt.startsWith('ukupan iznos')){
      el.classList.add('auto-total');
    }
  });
}

function renderHtml(){
  const html=input.value.trim();
  if(!html){alert('Nalepi HTML kod.');return;}
  preview.innerHTML=getCleanBody(html);   // NE ubacuje originalne <style> tagove
  formatDocument();
}

function execCmd(cmd){preview.focus();document.execCommand(cmd,false,null)}

function changeSize(direction){
  preview.focus();
  const selection=window.getSelection();
  if(!selection || selection.isCollapsed){alert('Prvo označi tekst.');return;}
  const size=direction>0?5:2;
  document.execCommand('fontSize',false,size);
  preview.querySelectorAll(`font[size="${size}"]`).forEach(f=>{
    f.removeAttribute('size');
    f.style.fontSize=direction>0?'18px':'10px';
  });
}

function addRow(){
  const table=preview.querySelector('table');
  if(!table){alert('Nema tabele.');return;}
  const body=table.tBodies[0] || table.appendChild(document.createElement('tbody'));
  const row=body.insertRow(-1);
  const cols=table.rows[0]?.cells.length || 3;
  for(let i=0;i<cols;i++) row.insertCell(i).textContent=i===0?'Novi proizvod':i===1?'1':'0 RSD';
}

function removeRow(){
  const table=preview.querySelector('table');
  const body=table?.tBodies[0];
  if(!body){alert('Nema tabele.');return;}
  if(body.rows.length<=1){alert('Mora ostati najmanje jedan proizvod.');return;}
  body.deleteRow(body.rows.length-1);
}

function saveHtml(){
  const html=`<!doctype html><html lang="sr"><head><meta charset="utf-8"><title>Otpremnica</title></head><body>${preview.innerHTML}</body></html>`;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='porudzbenica.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}

function downloadPdf(){
  const old=document.title;document.title='porudzbenica';window.print();setTimeout(()=>document.title=old,500);
}

function loadExample(){input.value=example;renderHtml()}
function clearAll(){input.value='';preview.textContent='Ovde će se prikazati porudžbenica.'}

loadExample();
</script>
</body>
</html>
